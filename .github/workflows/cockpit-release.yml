# Cockpit Release workflow.
#
# Trigger: tag `cockpit-v<version>` (version MUST match pubspec.yaml).
# Produces: GitHub Release with 6 artifacts + SHA256SUMS + latest.json.
# Publishing: the final job uploads latest.json + appcasts directly to rp-s3 via
# PUT /upload (Bearer RP_S3_UPLOAD_TOKEN) — see rp-s3/README.md. No manual
# gate: release goes live as soon as the workflow finishes.
#
# Platform runbook: cockpit/packaging/README.md.

name: cockpit-release

on:
  push:
    tags: ["cockpit-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. cockpit-v1.0.0); must exist"
        required: true

permissions:
  contents: write

concurrency:
  group: cockpit-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FLUTTER_VERSION: "3.44.4"

jobs:
  meta:
    name: Validate tag <-> pubspec
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - id: v
        run: |
          VERSION="${RELEASE_TAG#cockpit-v}"
          FULL=$(grep '^version:' cockpit/pubspec.yaml | awk '{print $2}')
          PUBSPEC="${FULL%%+*}"
          BUILD="${FULL##*+}"
          if [ "$VERSION" != "$PUBSPEC" ]; then
            echo "::error::tag $RELEASE_TAG requests $VERSION but pubspec is $PUBSPEC"
            exit 1
          fi
          # Sparkle (macOS) compares CFBundleVersion (+n). Without build
          # number self-update won't detect new version — require explicit +n.
          if [ "$BUILD" = "$FULL" ] || [ -z "$BUILD" ]; then
            echo "::error::pubspec requires build number (e.g. $VERSION+8) for Sparkle version comparison"
            exit 1
          fi
          # Sparkle notes are extracted from the FIRST `## ` section of
          # CHANGELOG.md. Fail early if version does not match.
          CHANGELOG_VERSION=$(awk '/^## /{print; exit}' cockpit/CHANGELOG.md \
            | sed -E 's/^## *\[?([0-9]+\.[0-9]+\.[0-9]+)\]?.*/\1/')
          if [ "$VERSION" != "$CHANGELOG_VERSION" ]; then
            echo "::error::CHANGELOG.md starts with '$CHANGELOG_VERSION' but release is $VERSION — write ## [$VERSION] section at the top"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  # x86_64 slice for cockpit-server. `dart build cli` does NOT cross-compile,
  # so this job runs on an Intel runner to build the x64 slice of the bundle;
  # the macOS job merges both with `lipo`.
  server-x64:
    name: cockpit-server (x86_64 slice)
    needs: meta
    runs-on: macos-15-intel
    defaults: { run: { working-directory: cockpit } }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rust (native assets for anaki)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update || true
          rustup default stable
          cargo --version
      - name: Build x86_64 bundle
        run: |
          flutter pub get
          ./tool/build-sidecar.sh
          # Sanity check: binary MUST be x86_64 (runner is Intel).
          for f in build/server-bundle/bin/*; do
            lipo -archs "$f"
            lipo -archs "$f" | grep -q x86_64 || {
              echo "::error::$(basename "$f") x64 is missing the x86_64 slice"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-server-x64
          path: cockpit/build/server-bundle
          retention-days: 1

  macos:
    name: macOS dmg (universal, notarized)
    needs: [meta, server-x64]
    runs-on: macos-latest
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      SIGN_ID: "Developer ID Application: Jacob Moura (U843T2P7A2)"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Libghostty build hook compiles ghostty dylib, requiring fixed Zig version.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Internal CLI (`cockpit-cli`, crate in cockpit/cli) is built as a UNIVERSAL binary.
      - name: Rust + Intel target (universal internal CLI)
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Internal CLI (`cockpit-cli`, crate in cockpit/cli) is built as a UNIVERSAL binary.
      - name: Rust + Intel target (universal internal CLI)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version

      - name: Download x86_64 slice of cockpit-server
        uses: actions/download-artifact@v4
        with:
          name: cockpit-server-x64
          path: cockpit/build/server-x64

      - name: Import Developer ID certificate into temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build · sign · notarize · zip (Sparkle) · dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          flutter pub get
          flutter build macos --release
          APP="build/macos/Build/Products/Release/Cockpit.app"
          # Merge x86_64 slice into arm64 bundle -> universal.
          SERVER_BUNDLE="$APP/Contents/Resources/cockpit-server-bundle"
          ./tool/lipo-server-bundle.sh "$SERVER_BUNDLE" build/server-x64
          # Re-sign server bundle dylibs and executable with entitlements.
          for f in "$SERVER_BUNDLE"/lib/*.dylib; do
            codesign --force --options runtime --timestamp -s "$SIGN_ID" "$f"
          done
          for f in "$SERVER_BUNDLE"/bin/*; do
            codesign --force --options runtime --timestamp \
              --entitlements macos/cockpit_hook.entitlements \
              --sign "$SIGN_ID" "$f"
          done
          for arch in arm64 x64; do
            exe="$SERVER_BUNDLE/bin/cockpit-server-$arch"
            [ -f "$exe" ] || {
              echo "::error::cockpit-server-$arch missing in bundle"; exit 1; }
            want=$([ "$arch" = x64 ] && echo x86_64 || echo arm64)
            lipo -archs "$exe" | grep -q "$want" || {
              echo "::error::cockpit-server-$arch is not $want"; exit 1; }
          done
          SMOKE="$RUNNER_TEMP/cockpit-server-smoke.sock"
          COCKPIT_PTY_DYLIB="$SERVER_BUNDLE/lib/libcockpit_pty.dylib" \
            "$SERVER_BUNDLE/bin/cockpit-server-arm64" \
            --socket "$SMOKE" --exit-on-idle 1 >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SMOKE" ] && break; sleep 0.5; done
          [ -S "$SMOKE" ] || {
            echo "::error::cockpit-server failed to start (broken bundle)"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server started and listening on $SMOKE"
          codesign --force --deep --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_ID" "$APP"
          codesign --force --options runtime --timestamp \
            --entitlements macos/cockpit_hook.entitlements \
            --sign "$SIGN_ID" "$APP/Contents/Resources/cockpit-hook"
          codesign --force --options runtime --timestamp \
            --entitlements macos/cockpit_hook.entitlements \
            --sign "$SIGN_ID" "$APP/Contents/Resources/cockpit-cli"
          codesign --force --options runtime --timestamp \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$SIGN_ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for f in "$SERVER_BUNDLE"/bin/* "$SERVER_BUNDLE"/lib/*.dylib; do
            codesign --verify --strict --verbose=2 "$f" || {
              echo "::error::$(basename "$f") in server bundle failed signature verification"
              exit 1
            }
          done
          lipo -archs "$APP/Contents/Resources/cockpit-cli"
          lipo -archs "$APP/Contents/Resources/cockpit-cli" | grep -q x86_64 || {
            echo "::error::cockpit-cli missing x86_64 slice"
            exit 1
          }
          "$APP/Contents/Resources/cockpit-cli" --version
          mkdir -p dist
          echo "$APPLE_API_KEY" | base64 -d > "$RUNNER_TEMP/apikey.p8"
          notarize() {
            local out
            out=$(xcrun notarytool submit "$1" --key "$RUNNER_TEMP/apikey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait 2>&1)
            echo "$out"
            if echo "$out" | grep -q "status: Invalid"; then
              local id
              id=$(echo "$out" | grep -m1 -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}')
              echo "::error::Notarization Invalid — submission log $id:"
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/apikey.p8" \
                --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" || true
              return 1
            fi
          }
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
          notarize "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple "$APP"
          ditto -c -k --keepParent "$APP" "dist/Cockpit-${VERSION}-macos.zip"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="dist/RemotePiCockpit-${VERSION}-macos-universal.dmg"
          hdiutil create -volname "Remote Pi Cockpit" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          rm -rf "$STAGE"
          codesign --force --timestamp --sign "$SIGN_ID" "$DMG"
          notarize "$DMG"
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          rm "$RUNNER_TEMP/apikey.p8"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          # dmg (first install) + Cockpit-<v>-macos.zip (Sparkle update).
          path: cockpit/dist/*
          if-no-files-found: error

  windows:
    name: Windows exe (x64, Inno Setup)
    needs: meta
    runs-on: windows-latest
    defaults: { run: { working-directory: cockpit, shell: bash } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Libghostty build hook compiles ghostty dylib using pinned Zig version.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Prepare Fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          echo "C:\\Program Files (x86)\\Inno Setup 6" >> "$GITHUB_PATH"

      - name: Build + package
        run: |
          flutter build windows --release
          # Sidecar guard: verify cockpit-server binary and dylib presence.
          SRV="build/windows/x64/runner/Release/cockpit-server-bundle/bin"
          test -x "$SRV/cockpit-server.exe" || {
            echo "::error::cockpit-server.exe missing from Windows bundle"; exit 1; }
          test -f "$SRV/cockpit_pty.dll" || {
            echo "::error::cockpit_pty.dll missing from server bundle"; exit 1; }
          ENDPOINT="$RUNNER_TEMP/cockpit-server-smoke.sock"
          "$SRV/cockpit-server.exe" --socket "$ENDPOINT" --exit-on-idle 1 \
            >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -f "$ENDPOINT" ] && break; sleep 0.5; done
          test -f "$ENDPOINT" || {
            echo "::error::cockpit-server failed to start on Windows"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          grep -q '"port"' "$ENDPOINT" || {
            echo "::error::endpoint announcement missing port: $(cat "$ENDPOINT")"
            exit 1
          }
          echo "[smoke] cockpit-server announced endpoint: $(cat "$ENDPOINT")"
          dart pub global run fastforge:main package --platform windows --targets exe
          EXE=$(find dist -name "*.exe" | head -1)
          test -n "$EXE"
          mkdir -p out
          mv "$EXE" "out/RemotePiCockpit-Setup-${VERSION}-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: cockpit/out/*.exe
          if-no-files-found: error

  linux:
    name: Linux deb+rpm (${{ matrix.deb_arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    # Safety timeout: default GitHub timeout is 6 hours.
    timeout-minutes: 45
    defaults: { run: { working-directory: cockpit } }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Flutter x64 (packaged SDK)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter SDK for linux-arm64 via git
      - name: Flutter arm64 (via git)
        if: matrix.deb_arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # Libghostty build hook compiles ghostty dylib using pinned Zig version.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: System dependencies (GTK, ninja, rpmbuild, libmpv)
        # Fixed package list, nothing to compile.
        timeout-minutes: 10
        env:
          # Non-interactive to prevent install hangs.
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Mirror retries with timeout per attempt.
          updated=0
          for attempt in 1 2 3; do
            if timeout 120 sudo -E apt-get update; then updated=1; break; fi
            echo "apt-get update failed/timed out (attempt $attempt)"
            sleep 5
          done
          [ "$updated" = 1 ] || {
            echo "::error::apt-get update failed after 3 attempts (mirror?)"
            exit 1
          }
          # libmpv-dev: media_kit links against libmpv on Linux.
          # libsecret-1-dev: flutter_secure_storage on Linux.
          sudo -E apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev rpm libmpv-dev libsecret-1-dev
          flutter --version
          dart pub global activate fastforge

      - name: Build + package
        # Builds Flutter, dart CLI, Rust CLI, and Zig libghostty.
        timeout-minutes: 30
        run: |
          flutter pub get
          flutter build linux --release
          # Sidecar guard: verify cockpit-server bundle.
          SRV="build/linux/${{ matrix.deb_arch == 'amd64' && 'x64' || 'arm64' }}/release/bundle/cockpit-server-bundle/bin"
          test -x "$SRV/cockpit-server" || {
            echo "::error::cockpit-server missing from Linux bundle ($SRV)"; exit 1; }
          test -f "$SRV/libcockpit_pty.so" || {
            echo "::error::libcockpit_pty.so missing from server bundle"; exit 1; }
          SOCK="$RUNNER_TEMP/cockpit-server-smoke.sock"
          COCKPIT_PTY_DYLIB="$SRV/libcockpit_pty.so" \
            "$SRV/cockpit-server" --socket "$SOCK" --exit-on-idle 1 \
            >"$RUNNER_TEMP/smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SOCK" ] && break; sleep 0.5; done
          [ -S "$SOCK" ] || {
            echo "::error::cockpit-server failed to start on Linux"
            cat "$RUNNER_TEMP/smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server started and listening on $SOCK"
          dart pub global run fastforge:main package --platform linux --targets deb
          dart pub global run fastforge:main package --platform linux --targets rpm
          DEB=$(find dist -name "*.deb" | head -1); test -n "$DEB"
          RPM=$(find dist -name "*.rpm" | head -1); test -n "$RPM"
          mkdir -p out
          mv "$DEB" "out/remote-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          mv "$RPM" "out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm"

      - name: Smoke test .deb (install on runner)
        # Smoke test installs deb on the runner.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get install -y "./out/remote-pi-cockpit_${VERSION}_${{ matrix.deb_arch }}.deb"
          dpkg -L remote-pi-cockpit | grep -m1 "\.desktop$"
          dpkg -L remote-pi-cockpit | grep -q "cockpit-server-bundle/bin/cockpit-server$" || {
            echo "::error::.deb missing cockpit-server bundle"; exit 1; }
          INSTALLED=$(dpkg -L remote-pi-cockpit | grep -m1 "cockpit-server-bundle/bin/cockpit-server$")
          SOCK="$RUNNER_TEMP/cockpit-server-deb.sock"
          "$INSTALLED" --socket "$SOCK" --exit-on-idle 1 \
            >"$RUNNER_TEMP/deb-smoke.log" 2>&1 &
          for i in $(seq 1 20); do [ -S "$SOCK" ] && break; sleep 0.5; done
          [ -S "$SOCK" ] || {
            echo "::error::cockpit-server installed from .deb failed to start"
            cat "$RUNNER_TEMP/deb-smoke.log" || true
            exit 1
          }
          echo "[smoke] cockpit-server from .deb started on $SOCK"

      - name: Smoke test .rpm (fedora:40 container)
        timeout-minutes: 10
        run: |
          # Query file with rpm -qpl
          docker run --rm -v "$PWD/out:/out:ro" fedora:40 bash -c \
            "dnf install -y /out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm \
             && rpm -qpl /out/remote-pi-cockpit-${VERSION}.${{ matrix.rpm_arch }}.rpm | grep -m1 '\.desktop$'"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.deb_arch }}
          path: cockpit/out/*
          if-no-files-found: error

  publish:
    name: GitHub Release + latest.json
    needs: [meta, macos, windows, linux]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # Download brings ALL run artifacts, including `cockpit-server-x64`
      # which is an input for macOS lipo, not a deliverable. Clean up here.
      - name: Discard intermediate inputs (deliverables only)
        run: |
          find release -mindepth 1 -maxdepth 1 -type d -print -exec rm -rf {} +
          ls -la release

      - name: Generate SHA256SUMS and latest.json
        run: |
          # Files only: skip directories
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | xargs -0 sha256sum > SHA256SUMS
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          : > artifacts.ndjson
          for f in *; do
            [ -f "$f" ] || continue   # pula bin/ e lib/ do artefato do servidor
            case "$f" in
              *macos-universal.dmg) p=macos   a=universal fmt=dmg ;;
              *windows-x64.exe)     p=windows a=x64       fmt=exe ;;
              *_amd64.deb)          p=linux   a=x64       fmt=deb ;;
              *_arm64.deb)          p=linux   a=arm64     fmt=deb ;;
              *.x86_64.rpm)         p=linux   a=x64       fmt=rpm ;;
              *.aarch64.rpm)        p=linux   a=arm64     fmt=rpm ;;
              *) continue ;;
            esac
            jq -n --arg platform "$p" --arg arch "$a" --arg format "$fmt" \
              --arg url "$BASE/$f" \
              --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson size "$(stat -c%s "$f")" \
              '{platform:$platform, arch:$arch, format:$format, url:$url, sha256:$sha256, size:$size}' \
              >> artifacts.ndjson
          done
          COUNT=$(jq -s length artifacts.ndjson)
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::expected 6 artifacts in manifest, found $COUNT"
            exit 1
          fi
          # Notes: first section of CHANGELOG; generic fallback.
          awk '/^## /{n++} n==1' ../cockpit/CHANGELOG.md | tail -n +2 \
            > "$RUNNER_TEMP/notes.md"
          NOTES=$(sed '/^$/d' "$RUNNER_TEMP/notes.md" | head -20)
          if [ -z "$NOTES" ]; then
            NOTES="Remote Pi Cockpit ${VERSION}"
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          fi
          jq -n --arg version "$VERSION" --arg date "$(date -u +%F)" \
            --arg notes "$NOTES" --slurpfile artifacts artifacts.ndjson \
            '{version:$version, date:$date, notes:$notes, artifacts:$artifacts}' \
            > latest.json
          rm artifacts.ndjson
          cat latest.json

      - name: Sign artifacts and generate appcasts (Sparkle/WinSparkle)
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD: ${{ needs.meta.outputs.build }}
        run: |
          # Sign .app.zip (macOS) and .exe (Windows) with the same ed25519 key.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pynacl
          cat > "$RUNNER_TEMP/sign.py" <<'PY'
          import base64, os, sys
          from nacl.signing import SigningKey
          seed = base64.b64decode(os.environ['SPARKLE_PRIVATE_KEY'].strip())
          data = open(sys.argv[1], 'rb').read()
          print(base64.b64encode(SigningKey(seed).sign(data).signature).decode())
          PY
          sign() { "$RUNNER_TEMP/venv/bin/python3" "$RUNNER_TEMP/sign.py" "$1"; }
          cd release
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          ZIP="Cockpit-${VERSION}-macos.zip"
          EXE="RemotePiCockpit-Setup-${VERSION}-windows-x64.exe"
          test -f "$ZIP"; test -f "$EXE"
          MAC_SIG=$(sign "$ZIP"); MAC_LEN=$(stat -c%s "$ZIP")
          WIN_SIG=$(sign "$EXE"); WIN_LEN=$(stat -c%s "$EXE")
          PUBDATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")
          # Sparkle/WinSparkle renders <description> as HTML in a webview.
          python3 ../cockpit/packaging/release_notes_html.py --selftest
          python3 ../cockpit/packaging/release_notes_html.py \
            < "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/notes.html"
          # macOS: sparkle:version = CFBundleVersion (build +n); shortVersion = marketing.
          cat > appcast-macos.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Remote Pi Cockpit</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>10.15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[@@NOTES@@]]></description>
                <enclosure url="${BASE}/${ZIP}" sparkle:edSignature="${MAC_SIG}" length="${MAC_LEN}" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          # Windows: WinSparkle downloads Inno .exe and runs silently via
          # sparkle:installerArguments; sparkle:version = marketing version.
          cat > appcast-windows.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Remote Pi Cockpit</title>
              <item>
                <title>${VERSION}</title>
                <pubDate>${PUBDATE}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <description><![CDATA[@@NOTES@@]]></description>
                <enclosure url="${BASE}/${EXE}" sparkle:edSignature="${WIN_SIG}" length="${WIN_LEN}" sparkle:os="windows" sparkle:installerArguments="/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" type="application/octet-stream" />
              </item>
            </channel>
          </rss>
          XML
          # Inject HTML via substitution (avoiding heredoc expansion issues).
          python3 - "$RUNNER_TEMP/notes.html" appcast-macos.xml appcast-windows.xml <<'PY'
          import sys
          notes = open(sys.argv[1], encoding='utf-8').read().replace(']]>', ']]&gt;')
          for path in sys.argv[2:]:
              with open(path, encoding='utf-8') as f:
                  xml = f.read()
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(xml.replace('@@NOTES@@', notes))
          PY
          if grep -q '@@NOTES@@' appcast-macos.xml appcast-windows.xml; then
            echo "::error::notes not injected into appcast (placeholder remaining)"
            exit 1
          fi
          echo "== appcast-macos.xml =="; cat appcast-macos.xml
          echo "== appcast-windows.xml =="; cat appcast-windows.xml

      - name: Create (or update) GitHub Release
        run: |
          NOTES_FILE=$(mktemp)
          jq -r .notes release/latest.json > "$NOTES_FILE"
          {
            echo ""
            echo "---"
            echo "**Publishing:** \`latest.json\` + appcasts are automatically uploaded"
            echo "to rp-s3 at the end of the workflow (enables site download and self-update)."
            echo "Manual fallback: download the 3 files from this release and place at"
            echo "\`/Users/flutterando/cockpit/data/\` (see \`rp-s3/README.md\`)."
          } >> "$NOTES_FILE"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --title "Remote Pi Cockpit ${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
          # The "Latest" badge is set on every release run (idempotent).
          gh release edit "$RELEASE_TAG" --latest

      # Publish manifests to rp-s3 (replaces manual gate). Runs AFTER release
      # exists on GitHub: URLs inside latest.json/appcasts point to release assets.
      - name: Publish manifests to rp-s3
        env:
          RP_S3_UPLOAD_TOKEN: ${{ secrets.RP_S3_UPLOAD_TOKEN }}
        run: |
          upload() {
            curl -fsS --retry 3 --retry-delay 5 -X PUT \
              -H "Authorization: Bearer ${RP_S3_UPLOAD_TOKEN}" \
              --data-binary "@release/$1" \
              "https://rp-s3.jacobmoura.work/upload/cockpit/$1"
          }
          upload appcast-macos.xml
          upload appcast-windows.xml
          upload SHA256SUMS
          upload latest.json
          echo "published: https://rp-s3.jacobmoura.work/downloads/cockpit/latest.json"
      - name: Summary
        run: |
          {
            echo "## Cockpit ${VERSION} published"
            echo ""
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo ""
            echo "Manifests published to rp-s3:"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/latest.json"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/appcast-macos.xml"
            echo "- https://rp-s3.jacobmoura.work/downloads/cockpit/appcast-windows.xml"
          } >> "$GITHUB_STEP_SUMMARY"
