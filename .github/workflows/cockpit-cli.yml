# CI for Cockpit internal CLI (Rust crate in `cockpit/cli/`).
#
# Binary materialized by the app at ~/.cockpit/bin/cockpit and also
# serves Claude Code hooks (`cockpit hook`). Runs on THREE platforms on
# purpose: transport has `#[cfg(unix)]` path (Unix socket) and Windows path
# (TCP loopback + token), verified across all target compilers. Wire tests
# (tests/wire.rs) spin up a mock server to check incoming requests against the app contract.

name: cockpit-cli

on:
  push:
    branches: [main]
    paths:
      - "cockpit/cli/**"
      - ".github/workflows/cockpit-cli.yml"
  pull_request:
    paths:
      - "cockpit/cli/**"
      - ".github/workflows/cockpit-cli.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: cockpit/cli

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Hosted runners already provide rustup/cargo; ensure stable and required components.
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
          cargo --version && rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cockpit/cli/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('cockpit/cli/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Intel slice on macOS: release is built on Apple Silicon and must run on Intel Mac.
      # Verifies compilation and that `lipo` produces an EXECUTABLE binary.
      - name: Universal macOS (arm64 + x86_64)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create target/aarch64-apple-darwin/release/cockpit \
                       target/x86_64-apple-darwin/release/cockpit \
               -output /tmp/cockpit-universal
          lipo -archs /tmp/cockpit-universal
          /tmp/cockpit-universal --version
          arch -x86_64 /tmp/cockpit-universal --version
