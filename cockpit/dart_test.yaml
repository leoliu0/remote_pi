# Test runner config.
#
# `preview`: tests that do NOT check behavior — they generate PNGs for visual
# inspection (e.g. the Windows title bar, which is never drawn on mac).
# Excluded from `flutter test` because they compare goldens that depend on
# the host's font rendering and would break in CI / another machine.
#
# To generate/review the images:
#   flutter test --tags preview --run-skipped --update-goldens
tags:
  preview:
    skip: "preview visual — run: flutter test --tags preview --run-skipped --update-goldens"
