[package]
name = "cockpit-cli"
version = "0.7.0"
edition = "2021"
rust-version = "1.74"
description = "Cockpit's internal CLI (and the Claude Code hook helper)"
license = "MIT"
publish = false

# Binary named `cockpit`, materialized at ~/.cockpit/bin/cockpit.
[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"

# Small binary optimized for universal lipo packaging.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
